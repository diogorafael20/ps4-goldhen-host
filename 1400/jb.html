<!doctype html>
<html lang="pt" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desbloqueio</title>
</head>
<body>
<!-- jb.js reads and writes these by name; they stay out of sight. -->
<div id="out" style="display:none"></div>
<div id="state" style="display:none"></div>
<div id="ramBox" style="display:none"></div>
<div id="msg" style="display:none">Restart your console</div>

<script src="../ui.js"></script>
<script type="module">
    import "./jb.js";
</script>
<script>
(function () {
    var out = document.getElementById("out");
    var UI = window.HostUI;

    UI.mount({ fw: window.HOST_FW || "", logEl: out });

    /* jb.js runs with log=1, so it never paints a final line of its own. Its
       marks are numbered stages; the last of them, "enabler running", is the
       only one that earns 100%. */
    function judge(t) {
        if (!t || UI.isDone()) return;
        if (/done -- jailbroken, rwx open, syscall 11 is a kexec gate, enabler running/.test(t)) {
            UI.done("Desbloqueio realizado", "o GoldHEN est\u00e1 a correr");
            return;
        }
        if (/no kernel stage for firmware|is not supported/.test(t)) {
            UI.fail("Firmware n\u00e3o suportado", "este desbloqueio n\u00e3o serve para esta consola");
            return;
        }
        if (/do not close this page, cold boot|handles are NOT defused/.test(t)) {
            UI.fail("Falhou", "desliga a PS4 e volta a ligar antes de repetir");
            return;
        }
        if (/gave up after|exploit failed|AG-FAIL/.test(t)) {
            UI.fail("Falhou", "reabre o browser e tenta outra vez");
            return;
        }
        if (/kernel interface is live/.test(t)) {
            UI.fail("Falhou", "a consola ficou desbloqueada mas o GoldHEN n\u00e3o arrancou; reinicia e tenta outra vez");
            return;
        }

        var pct = 0, msg = "";
        if (/\[g\]|\[p\]|\[e\]|\[10\]/.test(t)) { pct = 96; msg = "A carregar o GoldHEN\u2026"; }
        else if (/\[9\]/.test(t)) { pct = 84; msg = "A obter acesso root\u2026"; }
        else if (/\[8\]/.test(t)) { pct = 76; msg = "A aplicar os patches\u2026"; }
        else if (/\[7\]/.test(t)) { pct = 66; msg = "A localizar o kernel\u2026"; }
        else if (/\[6\]/.test(t)) { pct = 58; msg = "A abrir caminho para o kernel\u2026"; }
        else if (/\[5\]/.test(t)) { pct = 48; msg = "A preparar a mem\u00f3ria\u2026"; }
        else if (/\[4\]/.test(t)) { pct = 40; msg = "A preparar a mem\u00f3ria\u2026"; }
        else if (/attempt \d+/.test(t)) { pct = 24; msg = "A explorar a falha\u2026"; }
        else { pct = 12; msg = "A preparar o exploit\u2026"; }
        if (pct) UI.set(pct, msg);
    }

    var lastLen = 0;
    function onOut() {
        var t = out.textContent || "";
        if (t.length === lastLen) return;
        lastLen = t.length;
        judge(t);
    }

    if (window.MutationObserver) {
        new MutationObserver(onOut)
            .observe(out, { childList: true, characterData: true, subtree: true });
    } else {
        setInterval(onOut, 1500);
    }
}());
</script>
</body>
</html>
