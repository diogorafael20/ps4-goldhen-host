<!DOCTYPE html>
<html lang="pt" manifest="navigation.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>doesitworknow</title>
    <link rel="icon" type="image/png" href="pspulse.png">
    <style>
        body {
            margin: 0;
            padding: 28px 18px 36px;
            background: #1a1510;
            color: #fff8e7;
            font-family: Arial, Helvetica, sans-serif;
        }
        a { color: #ffd36a; text-decoration: underline; }

        .wrap {
            max-width: 520px;
            margin: 0 auto;
            border: 3px solid #ffd36a;
            background: #241c14;
            padding: 22px 18px 26px;
        }

        .stamp {
            display: inline-block;
            border: 3px solid #5eead4;
            color: #5eead4;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            padding: 6px 10px;
            margin-bottom: 14px;
            -webkit-transform: rotate(-6deg);
            transform: rotate(-6deg);
        }

        .brand {
            font-size: 28px;
            font-weight: bold;
            color: #fff8e7;
            margin: 8px 0 4px 0;
            line-height: 1.15;
        }
        .brand em {
            font-style: normal;
            color: #ffd36a;
        }

        .joke {
            font-size: 15px;
            color: #e7d7b8;
            margin: 0 0 18px 0;
            line-height: 1.4;
        }

        .row {
            background: #31251a;
            border-left: 6px solid #ffd36a;
            padding: 10px 12px;
            margin: 0 0 8px 0;
            font-size: 16px;
            line-height: 1.35;
        }
        .row b { color: #ffffff; }
        .ok { color: #86efac; }
        .warn { color: #fde047; }
        .bad { color: #fb7185; }

        .btn {
            display: block;
            width: 100%;
            margin-top: 18px;
            padding: 16px 12px;
            border: 0;
            background: #ffd36a;
            color: #1a1510;
            font: bold 20px/1.2 Arial, Helvetica, sans-serif;
            cursor: pointer;
            text-align: center;
        }
        .btn[disabled] {
            background: #5a4a38;
            color: #b8a88f;
            cursor: default;
        }

        .fallback {
            display: none;
            margin-top: 18px;
        }
        .fallback.show { display: block; }
        .fallback p {
            color: #e7d7b8;
            font-size: 14px;
            margin: 0 0 8px 0;
        }
        .fallback a {
            display: block;
            background: #31251a;
            color: #ffd36a;
            padding: 12px;
            margin: 0 0 6px 0;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #5a4a38;
        }

        .foot {
            margin-top: 20px;
            font-size: 12px;
            color: #a89070;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="stamp" id="stamp">EM ANALISE</div>
    <div class="brand">does it<br>work <em>now</em>?</div>
    <p class="joke" id="joke">A abrir o dossier da consola… se passar, ha desbloqueio. Se nao passar, ha desculpas.</p>

    <div class="row">Consola: <b id="dev">…</b></div>
    <div class="row">Firmware: <b id="fw">…</b></div>
    <div class="row">Veredicto: <b id="compat">…</b></div>

    <button type="button" class="btn" id="btn" disabled>A analisar…</button>

    <div class="fallback" id="fallback">
        <p>Escolhe o firmware a mao (como no exame oral):</p>
        <div id="routes"></div>
    </div>

    <div class="foot">doesitworknow · so desbloqueio · v4</div>
</div>

<script>
(function () {
    try {
        var ua0 = navigator.userAgent || "";
        var isLan = /^(127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname || "");
        if (ua0.indexOf("PlayStation 4") !== -1 && location.protocol === "https:" && !isLan &&
            location.hostname.indexOf("github.io") === -1) {
            location.replace("http://" + location.host + location.pathname + location.search);
            return;
        }
    } catch (e) {}

    var ROUTES = [
        { min: 14.00, max: 14.02, href: "1400/goldhen.html",          label: "14.00 – 14.02" },
        { min: 13.02, max: 13.52, href: "1352/index.html",            label: "13.02 – 13.52" },
        { min: 12.50, max: 13.00, href: "1300/index.html",            label: "12.50 – 13.00" },
        { min: 11.00, max: 12.02, href: "1300/index.html",            label: "11.00 – 12.02" },
        { min: 9.00,  max: 9.60,  href: "900/version-selector.html",  label: "9.00 – 9.60" },
        { min: 7.00,  max: 8.52,  href: "700/version-selector.html",  label: "7.00 – 8.52" },
        { min: 6.72,  max: 6.72,  href: "672/index.html",             label: "6.72" },
        { min: 6.00,  max: 11.02, href: "css/version-selector.html",  label: "6.00 – 11.02 (CSS)" },
        { min: 5.05,  max: 5.05,  href: "505/index.html",             label: "5.05" }
    ];

    var JOKES_OK = [
        "Aprovado com distinção. A Sony nao precisa de saber.",
        "Passou no teste. O botao amarelo e a tua responsabilidade agora.",
        "Consola idonea. Exploit a aquecer os motores."
    ];
    var JOKES_BAD = [
        "Reprovado. Este firmware ainda nao tem o nosso carimbo.",
        "O dossier ficou a meio. Firmware fora da lista."
    ];

    function $(id) { return document.getElementById(id); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)] || arr[0]; }
    function isPS4() { return (navigator.userAgent || "").indexOf("PlayStation 4") !== -1; }
    function getFw() {
        var ua = navigator.userAgent || "";
        var m = ua.match(/PlayStation 4\/([0-9.]+)/);
        if (m) return m[1];
        var s = ua.indexOf("5.0 (") + 19, e = ua.indexOf(") Apple");
        if (s > 18 && e > s) return ua.substring(s, e).replace("layStation 4/", "").trim();
        return null;
    }
    function route(fw) {
        var n = parseFloat(fw);
        if (isNaN(n)) return null;
        for (var i = 0; i < ROUTES.length; i++) if (n >= ROUTES[i].min && n <= ROUTES[i].max) return ROUTES[i];
        return null;
    }
    function showFallback() {
        var h = "";
        for (var i = 0; i < ROUTES.length; i++)
            h += '<a href="' + ROUTES[i].href + '">FW ' + ROUTES[i].label + '</a>';
        $("routes").innerHTML = h;
        $("fallback").className = "fallback show";
    }
    function set(id, text, cls) {
        var el = $(id);
        el.textContent = text;
        el.className = cls || "";
    }
    function stamp(text, color) {
        var el = $("stamp");
        el.textContent = text;
        if (color) el.style.borderColor = color, el.style.color = color;
    }

    var btn = $("btn");

    if (!isPS4()) {
        stamp("FORA DE CASA", "#fde047");
        set("dev", "isto nao e uma PS4", "warn");
        set("fw", "—");
        set("compat", "abre na consola, campeao", "warn");
        $("joke").textContent = "Detectamos um dispositivo civil. O desbloqueio so funciona na PS4.";
        btn.textContent = "Abre na PS4";
        showFallback();
        return;
    }

    set("dev", "PlayStation 4", "ok");
    var fw = getFw();
    if (!fw) {
        stamp("DUVIDA", "#fde047");
        set("fw", "desconhecido", "warn");
        set("compat", "escolhe em baixo", "warn");
        $("joke").textContent = "O firmware escondeu-se. Escolhe a mao — nao faz mal a ninguem.";
        btn.textContent = "Firmware nao detectado";
        showFallback();
        return;
    }
    set("fw", fw, "ok");

    var r = route(fw);
    if (!r) {
        stamp("REPROVADO", "#fb7185");
        set("compat", "nao suportado", "bad");
        $("joke").textContent = pick(JOKES_BAD);
        btn.textContent = "FW " + fw + " fora da lista";
        return;
    }

    stamp("APROVADO", "#86efac");
    set("compat", "pode desbloquear", "ok");
    $("joke").textContent = pick(JOKES_OK);
    btn.disabled = false;
    btn.textContent = "Desbloquear";
    btn.onclick = function () { location.href = r.href; };
    btn.focus();
})();
</script>
</body>
</html>
