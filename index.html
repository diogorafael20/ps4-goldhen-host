<!DOCTYPE html>
<html lang="pt" manifest="navigation.manifest">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>doesitworknow</title>
    <link rel="icon" type="image/png" href="pspulse.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: #111827;
            color: #fff;
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }

        .screen {
            min-height: 100%;
            padding: 48px 24px 40px;
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
            -webkit-box-align: center; -webkit-align-items: center; align-items: center;
            -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
            text-align: center;
        }

        /* Logo */
        .logo {
            width: 192px; height: 192px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-box-align: center; -webkit-align-items: center; align-items: center;
            -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
            -webkit-transition: background .3s; transition: background .3s;
        }
        .logo:hover { background: rgba(255,255,255,0.10); }
        .logo svg { width: 128px; height: 128px; fill: #3b82f6; }
        .logo.pulse svg { -webkit-animation: pulse 1.6s ease-in-out infinite; animation: pulse 1.6s ease-in-out infinite; }
        @-webkit-keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

        h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin-top: 22px; }
        h1 span { color: #3b82f6; }

        /* Status */
        .status {
            margin-top: 18px;
            font-size: 18px;
            line-height: 1.7;
            color: rgba(255,255,255,0.70);
        }
        .status b { font-weight: 600; color: #fff; }
        .ok   { color: #4ade80 !important; }
        .warn { color: #fbbf24 !important; }
        .bad  { color: #f87171 !important; }

        /* Button */
        .btn {
            display: inline-block;
            margin-top: 26px;
            min-width: 260px;
            padding: 16px 34px;
            border: 0;
            border-radius: 12px;
            background: #2563eb;
            color: #fff;
            font: 600 20px/1.2 inherit;
            font-family: inherit;
            cursor: pointer;
            -webkit-transition: background .2s; transition: background .2s;
        }
        .btn:hover, .btn:focus { background: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,.45); }
        .btn[disabled] { background: #374151; color: rgba(255,255,255,0.45); cursor: default; box-shadow: none; }

        /* Fallback list (only when detection fails) */
        .fallback { display: none; margin-top: 26px; width: 100%; max-width: 440px; }
        .fallback p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 10px; }
        .fallback a {
            display: block;
            background: #1f2937;
            border-radius: 10px;
            padding: 13px 16px;
            margin-bottom: 8px;
            font-size: 17px;
            text-align: left;
        }
        .fallback a span { float: right; color: rgba(255,255,255,0.5); font-size: 14px; }
        .fallback a:hover, .fallback a:focus { background: #374151; outline: none; }
        .fallback.show { display: block; }

        .ver { position: fixed; right: 16px; bottom: 12px; font-size: 12px; color: rgba(255,255,255,0.35); }

        @media (max-width: 480px) {
            .logo { width: 150px; height: 150px; }
            .logo svg { width: 100px; height: 100px; }
            h1 { font-size: 28px; }
            .btn { min-width: 0; width: 100%; }
        }
    </style>
</head>
<body>
<div class="screen">
    <div class="logo pulse" id="logo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M0.69116 21.9548C-0.506476 22.7935 -0.284724 24.2384 2.44769 25.1419C5.18011 26.0455 8.35603 26.2323 11.1505 25.729C11.0707 25.729 11.3102 25.729 11.1505 25.729V22.8774L8.43588 23.8C7.39792 24.1355 6.35997 24.2194 5.32202 23.9677C4.5236 23.7161 4.68328 23.2129 5.64139 22.7935L11.1505 20.7806V17.6774L3.48565 20.4452C2.52754 20.7806 1.56943 21.2839 0.69116 21.9548ZM19.2146 9.37419V17.5097C22.4881 19.1871 25.0431 17.5097 25.0431 13.1484C25.0431 8.70323 23.5261 6.69032 19.1348 5.09677C16.8193 4.25806 14.4241 3.50323 12.0288 3V27.2387L17.6178 29V8.61935C17.6178 7.69677 17.6178 7.02581 18.2565 7.27742C19.1348 7.52903 19.2146 8.45161 19.2146 9.37419ZM29.5941 20.0258C27.2787 19.1871 24.8036 18.8516 22.4083 19.1032C21.0779 19.1906 19.8294 19.5869 18.5759 20.0258V23.2968L23.7656 21.2839C24.8036 20.9484 25.8415 20.8645 26.8795 21.1161C27.6779 21.3677 27.5182 21.871 26.5601 22.2903L18.5759 25.3935V28.5806L29.5941 24.3032C30.3925 23.9677 31.1111 23.5484 31.7499 22.8774C32.3088 22.0387 32.0692 20.8645 29.5941 20.0258Z"/></svg>
    </div>

    <h1>doesitworknow<span>.</span></h1>

    <div class="status">
        <div>Dispositivo: <b id="dev">a detectar…</b></div>
        <div>Firmware: <b id="fw">…</b></div>
        <div>Compatível: <b id="compat">…</b></div>
    </div>

    <button type="button" class="btn" id="btn" disabled>A detectar…</button>

    <div class="fallback" id="fallback">
        <p>Escolhe o firmware manualmente:</p>
        <div id="routes"></div>
    </div>
</div>
<div class="ver">activate · v2</div>

<script>
(function () {
    // On PS4, prefer HTTP (certificates + bin loaders).
    try {
        var ua0 = navigator.userAgent || "";
        var isLan = /^(127\.|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname || "");
        if (ua0.indexOf("PlayStation 4") !== -1 && location.protocol === "https:" && !isLan &&
            location.hostname.indexOf("github.io") === -1) {
            location.replace("http://" + location.host + location.pathname + location.search);
            return;
        }
    } catch (e) {}

    var ROUTES = [
        { min: 14.00, max: 14.02, href: "1400/goldhen.html",          label: "14.00 – 14.02" },
        { min: 13.02, max: 13.52, href: "1352/index.html",            label: "13.02 – 13.52" },
        { min: 12.50, max: 13.00, href: "1300/index.html",            label: "12.50 – 13.00" },
        { min: 11.00, max: 12.02, href: "1300/index.html",            label: "11.00 – 12.02" },
        { min: 9.00,  max: 9.60,  href: "900/version-selector.html",  label: "9.00 – 9.60" },
        { min: 7.00,  max: 8.52,  href: "700/version-selector.html",  label: "7.00 – 8.52" },
        { min: 6.72,  max: 6.72,  href: "672/index.html",             label: "6.72" },
        { min: 6.00,  max: 11.02, href: "css/version-selector.html",  label: "6.00 – 11.02 (CSS)" },
        { min: 5.05,  max: 5.05,  href: "505/index.html",             label: "5.05" }
    ];

    function $(id) { return document.getElementById(id); }
    function isPS4() { return (navigator.userAgent || "").indexOf("PlayStation 4") !== -1; }
    function getFw() {
        var ua = navigator.userAgent || "";
        var m = ua.match(/PlayStation 4\/([0-9.]+)/);
        if (m) return m[1];
        var s = ua.indexOf("5.0 (") + 19, e = ua.indexOf(") Apple");
        if (s > 18 && e > s) return ua.substring(s, e).replace("layStation 4/", "").trim();
        return null;
    }
    function route(fw) {
        var n = parseFloat(fw);
        if (isNaN(n)) return null;
        for (var i = 0; i < ROUTES.length; i++) if (n >= ROUTES[i].min && n <= ROUTES[i].max) return ROUTES[i];
        return null;
    }
    function showFallback() {
        var h = "";
        for (var i = 0; i < ROUTES.length; i++)
            h += '<a href="' + ROUTES[i].href + '">FW ' + ROUTES[i].label + '<span>abrir</span></a>';
        $("routes").innerHTML = h;
        $("fallback").className = "fallback show";
    }
    function set(id, text, cls) { var el = $(id); el.textContent = text; el.className = cls || ""; }

    var dev = $("dev"), btn = $("btn"), logo = $("logo");
    logo.className = "logo";

    if (!isPS4()) {
        set("dev", "não é uma PS4", "warn");
        set("fw", "—");
        set("compat", "abre este site na consola", "warn");
        btn.textContent = "Abre na PS4";
        showFallback();
        return;
    }

    set("dev", "PlayStation 4", "ok");
    var fw = getFw();
    if (!fw) {
        set("fw", "desconhecido", "warn");
        set("compat", "escolhe em baixo", "warn");
        btn.textContent = "Firmware não detectado";
        showFallback();
        return;
    }
    set("fw", fw, "ok");

    var r = route(fw);
    if (!r) {
        set("compat", "não", "bad");
        btn.textContent = "FW " + fw + " não suportado";
        return;
    }

    set("compat", "sim", "ok");
    btn.disabled = false;
    btn.textContent = "Jailbreak";
    btn.onclick = function () { location.href = r.href; };
    logo.onclick = btn.onclick;
    btn.focus();
})();
</script>
</body>
</html>
