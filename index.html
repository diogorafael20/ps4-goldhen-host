<!DOCTYPE html>
<html lang="en" manifest="navigation.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Unlock</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background: #0b0e12;
    color: #e8edf3;
    font: 16px/1.5 Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    overflow: auto;
}
.wrap { width: 100%; max-width: 400px; padding: 32px 24px; text-align: center; }
.mark {
    width: 58px; height: 58px; margin: 0 auto 26px; border-radius: 14px;
    background: #141b24; border: 1px solid #1f2933;
    display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center;
    -webkit-box-pack: center; justify-content: center;
}
.mark svg { width: 34px; height: 34px; display: block; }
.title { font-size: 30px; font-weight: bold; letter-spacing: -.02em; margin: 0 0 8px; }
.sub { color: #93a1b1; font-size: 15px; margin: 0 0 6px; min-height: 22px; }
.fw { color: #4d5867; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 30px; }

.btn {
    display: block; width: 100%; padding: 19px 16px; border: 0; border-radius: 8px;
    background: #7cc4ff; color: #0b0e12;
    font: bold 19px/1.2 Arial, Helvetica, sans-serif; cursor: pointer;
    -webkit-appearance: none;
}
.btn[disabled] { background: #1b222c; color: #5f6b7a; cursor: default; }
.btn.go { background: #7fe0a6; }

.opts { margin: 22px 0 0; font-size: 12px; }
.opts a { color: #4d5867; text-decoration: none; }

.legal {
    margin: 30px 0 0; color: #39424f; font-size: 11px; line-height: 1.5;
    text-align: center; padding: 0 4px;
}
.legal a { color: #4d5867; text-decoration: underline; }

.panel { display: none; margin: 20px 0 0; text-align: left; }
.panel.open { display: block; }
.panel .lab {
    color: #4d5867; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; margin: 16px 0 8px;
}
.panel a.row {
    display: block; padding: 12px 14px; margin: 0 0 6px; border-radius: 6px;
    background: #11161d; border: 1px solid #161d26;
    color: #93a1b1; text-decoration: none; font-size: 14px;
}
.panel a.row.on { background: #16222f; border-color: #24405c; color: #7cc4ff; }
</style>
</head>
<body>
<div class="wrap">
    <div class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <!-- the four face buttons, in their controller positions -->
            <polygon points="16,2.8 20.4,10.4 11.6,10.4"
                     fill="none" stroke="#5fd6c8" stroke-width="1.7"
                     stroke-linejoin="round"/>
            <circle cx="25.2" cy="16" r="4.2"
                    fill="none" stroke="#ff8080" stroke-width="1.7"/>
            <path d="M3.9 12.4 L10.9 19.6 M10.9 12.4 L3.9 19.6"
                  fill="none" stroke="#8fb6f0" stroke-width="1.7"
                  stroke-linecap="round"/>
            <rect x="12.3" y="21.6" width="7.4" height="7.4"
                  fill="none" stroke="#f0a3d0" stroke-width="1.7"
                  stroke-linejoin="round"/>
        </svg>
    </div>
    <div class="title" id="title">Unlock</div>
    <div class="sub" id="sub">Checking the console&hellip;</div>
    <div class="fw" id="fwtxt">&nbsp;</div>

    <button type="button" class="btn" id="go" disabled>Wait&hellip;</button>

    <div class="opts"><a href="#" id="optlink">options</a></div>

    <div class="panel" id="panel">
        <div class="lab">Payload</div>
        <div id="plist">
            <a href="#" class="row on" data-p="goldhen">GoldHEN (recommended)</a>
            <a href="#" class="row" data-p="ps4hen">PS4HEN &mdash; 14.xx only</a>
        </div>
        <div class="lab">Firmware</div>
        <div id="flist"></div>
    </div>

    <div class="legal">
        For study and testing on your own console. You use it at your own risk:
        it can brick the console or get a PSN account banned. Not affiliated with Sony.
        <a href="notice.html">Full notice</a>
    </div>
</div>

<script>
(function () {
    /* Ranges, not a table of exact versions: a console that reports 13.04 or
       12.52 has to land on the same host as 13.02 or 12.50. */
    var ROUTES = [
        { min: 14.00, max: 14.02, label: "14.00 \u2013 14.02", dir: "1400" },
        { min: 13.02, max: 13.52, label: "13.02 \u2013 13.52", dir: "1352" },
        { min: 12.50, max: 13.00, label: "12.50 \u2013 13.00", dir: "1300" },
        { min: 11.00, max: 12.02, label: "11.00 \u2013 12.02", dir: "1300" },
        { min: 9.00,  max: 9.60,  label: "9.00 \u2013 9.60",     dir: "900" },
        { min: 7.00,  max: 8.52,  label: "7.00 \u2013 8.52",     dir: "700" },
        { min: 6.72,  max: 6.72,  label: "6.72",                dir: "672" },
        { min: 5.05,  max: 5.05,  label: "5.05",                dir: "505" },
        { min: 6.00,  max: 11.02, label: "6.00 \u2013 11.02",     dir: "css/version-selector.html" }
    ];

    function $(id) { return document.getElementById(id); }

    function isPS4() {
        return (navigator.userAgent || "").indexOf("PlayStation 4") !== -1;
    }

    /* The exploit tables decode the UA minor as hex, so do it the same way
       here or the two disagree on 12.5x and 13.5x. */
    function getFw() {
        var m = (navigator.userAgent || "").match(/PlayStation\s+4[\/ ](\d+)\.(\d+)/);
        if (!m) return null;
        var minor = parseInt(m[2], 16);
        var hex = minor.toString(16);
        if (hex.length < 2) hex = "0" + hex;
        return m[1] + "." + hex;
    }

    function route(fw) {
        var n = parseFloat(fw);
        if (isNaN(n)) return null;
        for (var i = 0; i < ROUTES.length; i++) {
            if (n >= ROUTES[i].min && n <= ROUTES[i].max) return ROUTES[i];
        }
        return null;
    }

    /* Where one press actually goes. Each of these destinations starts the
       chain on load: there is no second screen to navigate. */
    function target(r, p) {
        if (r.dir === "1400") {
            return "1400/" + (p === "ps4hen" ? "?payload=hen.bin" : "?mode=goldhen");
        }
        return r.dir === "css/version-selector.html" ? r.dir : r.dir + "/";
    }

    var payload = "goldhen";
    var forced = null;
    var picked = null;
    var btn = $("go");

    function show(title, sub, cls) {
        $("title").textContent = title;
        $("title").style.color = cls === "ok" ? "#7fe0a6" : cls === "bad" ? "#ff9d9d" : "";
        $("sub").textContent = sub || "";
    }

    function buildFwList() {
        var h = '<a href="#" class="row" data-fw="">Automatic</a>';
        for (var i = 0; i < ROUTES.length; i++) {
            h += '<a href="#" class="row" data-i="' + i + '">' + ROUTES[i].label + '</a>';
        }
        $("flist").innerHTML = h;
    }

    function markActive() {
        var rows = $("plist").getElementsByTagName("a");
        for (var i = 0; i < rows.length; i++) {
            rows[i].className = "row" + (rows[i].getAttribute("data-p") === payload ? " on" : "");
        }
        var fr = $("flist").getElementsByTagName("a");
        for (var j = 0; j < fr.length; j++) {
            var idx = fr[j].getAttribute("data-i");
            var on = (idx === null && !forced) || (forced && String(ROUTES.indexOf(forced)) === idx);
            fr[j].className = "row" + (on ? " on" : "");
        }
    }

    function render() {
        markActive();
        btn.className = "btn";

        var fw = getFw();
        var r = forced || route(fw || "");

        if (!isPS4() && !forced) {
            show("Open on the PS4", "This only works in the console's own browser.", "bad");
            $("fwtxt").innerHTML = "&nbsp;";
            btn.disabled = true;
            btn.textContent = "Open on the PS4";
            return;
        }

        if (!r) {
            show("Firmware not supported", "No unlock for this firmware.", "bad");
            $("fwtxt").textContent = fw ? "PS4 \u00b7 " + fw : "";
            btn.disabled = true;
            btn.textContent = "Not supported";
            return;
        }

        var p = payload;
        if (p === "ps4hen" && r.dir !== "1400") p = "goldhen";

        picked = target(r, p);
        $("fwtxt").textContent = "PS4 \u00b7 " + r.label;
        show("Unlock",
            (p === "ps4hen" ? "PS4HEN" : "GoldHEN") + " \u00b7 firmware " + r.label,
            "");
        btn.disabled = false;
        btn.textContent = "Unlock";
    }

    btn.onclick = function () {
        if (!picked) return;
        btn.disabled = true;
        btn.className = "btn go";
        btn.textContent = "Unlocking\u2026";
        $("sub").textContent = "Don't close the browser.";
        setTimeout(function () { location.href = picked; }, 200);
    };

    $("optlink").onclick = function (ev) {
        ev.preventDefault();
        var p = $("panel");
        var open = p.className.indexOf("open") !== -1;
        p.className = open ? "panel" : "panel open";
        this.textContent = open ? "options" : "close";
    };

    $("plist").onclick = function (ev) {
        var a = ev.target;
        if (!a || !a.getAttribute || !a.getAttribute("data-p")) return;
        ev.preventDefault();
        payload = a.getAttribute("data-p");
        render();
    };

    $("flist").onclick = function (ev) {
        var a = ev.target;
        if (!a || !a.getAttribute) return;
        var idx = a.getAttribute("data-i");
        if (idx === null && !a.getAttribute("data-fw")) return;
        ev.preventDefault();
        forced = idx === null || idx === "" ? null : ROUTES[parseInt(idx, 10)];
        render();
    };

    buildFwList();
    render();
}());
</script>
</body>
</html>
