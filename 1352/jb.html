<!DOCTYPE html>
<html lang="pt" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desbloqueio</title>
<link rel="icon" type="image/png" href="../pspulse.png">
</head>
<body>
<!-- jb.js writes its step log into #out and its status line into #state. -->
<div id="out" style="display:none"></div>
<div id="state" style="display:none"></div>
<div id="msg" style="display:none">Restart your console</div>

<script src="../ui.js"></script>
<script type="module">import "./jb.js";</script>
<script>
(function () {
    var out = document.getElementById("out");
    var UI = window.HostUI;
    var RELOAD_KEY = "hostui.1352.reloads";

    UI.mount({ fw: window.HOST_FW || "", logEl: out });

    /* jb.js only reports with log=1, and in that mode it does not paint a
       final message of its own -- so progress comes from its own marks. The
       payload thread is the only thing that earns 100%. */
    function judge(t) {
        if (!t || UI.isDone()) return;
        if (/PROOF-OK\s+PAYLOAD-RUNNING|payload_running=1/.test(t)) {
            UI.done("Desbloqueio realizado", "o GoldHEN est\u00e1 a correr");
            return;
        }
        if (/FW-UNSUPPORTED|no offsets for this firmware/.test(t)) {
            UI.fail("Firmware n\u00e3o suportado", "este desbloqueio n\u00e3o serve para esta consola");
            return;
        }
        if (/REBOOT-REQUIRED|REBOOT FIRST|is still poisoned/.test(t)) {
            UI.fail("Falhou", "desliga a PS4 e volta a ligar antes de repetir");
            return;
        }
        if (/PROOF-FAIL\s+PAYLOAD-RUNNING|payload_running=0/.test(t)) {
            UI.fail("Falhou", "a consola ficou desbloqueada mas o GoldHEN n\u00e3o arrancou; reinicia e tenta outra vez");
            return;
        }
        if (/THREW|GIVEUP|attempt-ceiling/.test(t)) {
            UI.fail("Falhou", "reabre o browser e tenta outra vez");
            return;
        }

        var pct = 0, msg = "";
        if (/PAYLOAD-RUN|PAYLOAD-COPY/.test(t)) { pct = 96; msg = "A carregar o GoldHEN\u2026"; }
        else if (/KPATCH/.test(t)) { pct = 86; msg = "A aplicar os patches\u2026"; }
        else if (/JB-ROOT|uid 0/.test(t)) { pct = 74; msg = "A obter acesso root\u2026"; }
        else if (/JB-ALREADY|EG-VERDICT/.test(t)) { pct = 70; msg = "A verificar\u2026"; }
        else if (/PR-GATE|PR-DRAIN/.test(t)) { pct = 62; msg = "A fechar a corrida\u2026"; }
        else if (/aio_multi|make_karw|leak/.test(t)) { pct = 48; msg = "A abrir caminho para o kernel\u2026"; }
        else if (/attempt \d+|primitive|workers/.test(t)) { pct = 26; msg = "A explorar a falha\u2026"; }
        else { pct = 12; msg = "A preparar o exploit\u2026"; }
        if (pct) UI.set(pct, msg);
    }

    var lastLen = 0;

    /* The log is repainted whole, so re-reading it on every mutation would be
       quadratic work inside a kernel race. Only judge again when it changed. */
    function onOut() {
        var t = out.textContent || "";
        if (t.length === lastLen) return;
        lastLen = t.length;
        judge(t);
        maybeReload(t);
    }

    function maybeReload(t) {
        if (UI.isDone() || t.indexOf("attempt-ceiling") === -1) return;
        var n = 0;
        try { n = parseInt(sessionStorage.getItem(RELOAD_KEY) || "0", 10) || 0; } catch (e) { n = 0; }
        if (n >= 2) return;
        try { sessionStorage.setItem(RELOAD_KEY, String(n + 1)); } catch (e) { return; }
        var m = document.getElementById("huMsg");
        if (m) m.textContent = "A mem\u00f3ria n\u00e3o caiu no s\u00edtio certo. A tentar outra vez\u2026";
        setTimeout(function () { location.reload(); }, 2500);
    }

    if (window.MutationObserver) {
        new MutationObserver(onOut)
            .observe(out, { childList: true, characterData: true, subtree: true });
    } else {
        setInterval(onOut, 1500);
    }
    onOut();
}());
</script>
</body>
</html>
