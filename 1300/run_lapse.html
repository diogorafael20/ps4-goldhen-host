<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlock</title>
<link rel="icon" type="image/png" href="../icon.png">
</head>
<body>
<div id="out" style="display:none"></div>
<div id="state" style="display:none"></div>

<script src="../ui.js"></script>
<script type="module">import "./chain_lapse.js";</script>
<script>
(function () {
    var out = document.getElementById("out");
    var stateEl = document.getElementById("state");
    var UI = window.HostUI;
    var RELOAD_KEY = "hostui.lapse.reloads";

    UI.mount({ fw: window.HOST_FW || "", logEl: out });

    var STAGES = [
        [/running the primitive|setting up/, 10, "Preparing the exploit\u2026"],
        [/wiring the worker/, 16, null],
        [/aio batches|dry run/, 20, null],
        [/racing/, 28, "Exploiting the flaw\u2026"],
        [/leaking kernel addresses/, 36, null],
        [/stage 3/, 44, "Preparing memory\u2026"],
        [/stage 4/, 52, "Reading system memory\u2026"],
        [/stage 5/, 58, null],
        [/stage 6|KernelView/, 64, "Locating the kernel\u2026"],
        [/stage 7/, 70, null],
        [/stage 8/, 78, "Getting root access\u2026"],
        [/stage 9/, 86, "Applying the patches\u2026"],
        [/stage 10/, 94, "Loading GoldHEN\u2026"]
    ];

    function judge(t) {
        if (!t || UI.isDone()) return;
        if (/ALL DONE/.test(t)) {
            UI.done("Unlock complete", "GoldHEN is running");
            return;
        }
        if (/ALREADY JAILBROKEN/.test(t)) {
            UI.done("Unlock complete", "it was already unlocked");
            return;
        }
        if (/NO REBOOT NEEDED/.test(t)) {
            UI.fail("Failed", "the console is unlocked but GoldHEN did not start; reboot and try again");
            return;
        }
        if (/REBOOT/.test(t)) {
            UI.fail("Failed", "power the console off and on before trying again");
            return;
        }
        if (/no win in/.test(t)) {
            UI.fail("Failed", "close and reopen the browser, then try again");
            return;
        }
        if (/no offsets/.test(t)) {
            UI.fail("Firmware not supported", "this unlock does not apply to this console");
            return;
        }
        if (/FAILED/.test(t)) {
            UI.fail("Failed", "close and reopen the browser, then try again");
            return;
        }
        for (var i = 0; i < STAGES.length; i++) {
            if (STAGES[i][0].test(t)) {
                UI.set(STAGES[i][1], STAGES[i][2]);
                break;
            }
        }
    }

    function refresh() { judge(stateEl.textContent || ""); }

    /* A heap-layout miss costs nothing in the kernel, and only a fresh page
       load reshuffles the heap -- this WebKit exposes no GC. Reload twice at
       most, and only for that exact signature: a failure that reached the
       kernel must never be re-run without a cold boot. */
    function maybeReload() {
        if (UI.isDone()) return;
        if ((out.textContent || "").indexOf("attempt-ceiling") === -1) return;
        var n = 0;
        try { n = parseInt(sessionStorage.getItem(RELOAD_KEY) || "0", 10) || 0; } catch (e) { n = 0; }
        if (n >= 2) return;
        try { sessionStorage.setItem(RELOAD_KEY, String(n + 1)); } catch (e) { return; }
        var m = document.getElementById("huMsg");
        if (m) m.textContent = "The memory did not land in the right place. Trying again\u2026";
        setTimeout(function () { location.reload(); }, 2500);
    }

    if (window.MutationObserver) {
        new MutationObserver(function () { refresh(); maybeReload(); })
            .observe(stateEl, { childList: true, characterData: true, subtree: true });
        new MutationObserver(function () { refresh(); maybeReload(); })
            .observe(out, { childList: true, characterData: true, subtree: true });
    } else {
        setInterval(function () { refresh(); maybeReload(); }, 1500);
    }
    refresh();
}());
</script>
</body>
</html>
