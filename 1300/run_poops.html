<!DOCTYPE html>
<html lang="pt" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desbloqueio</title>
<link rel="icon" type="image/png" href="../pspulse.png">
</head>
<body>
<!-- The chain writes progress into #state and its log into #out; both are
     read here, never polled on a timer -- this is a kernel race and periodic
     work is what it must not have. -->
<div id="out" style="display:none"></div>
<div id="state" style="display:none"></div>

<script src="../ui.js"></script>
<script type="module">import "./chain_poops.js";</script>
<script>
(function () {
    var out = document.getElementById("out");
    var stateEl = document.getElementById("state");
    var UI = window.HostUI;

    UI.mount({ fw: window.HOST_FW || "", logEl: out });

    /* Stages in the order this chain reaches them. A stage only moves the
       bar forward; nothing here can claim more than the chain has done. */
    var STAGES = [
        [/running the primitive|setting up/, 12, "A preparar o exploit\u2026"],
        [/bringing up|workers/, 18, null],
        [/sweeping/, 26, "A procurar a falha na mem\u00f3ria\u2026"],
        [/attempt \d+/, 32, null],
        [/leaking a kqueue/, 44, "A recolher informa\u00e7\u00e3o do sistema\u2026"],
        [/kread_slow/, 54, null],
        [/make_karw/, 60, "A abrir caminho para o kernel\u2026"],
        [/sandbox escape/, 68, "A sair da sandbox\u2026"],
        [/remove_uaf_file/, 74, null],
        [/kernel patches/, 86, "A aplicar os patches\u2026"],
        [/payload\.\.\./, 94, "A carregar o GoldHEN\u2026"]
    ];

    function judge(t) {
        if (!t || UI.isDone()) return;
        if (/ALL DONE/.test(t)) {
            UI.done("Desbloqueio realizado", "o GoldHEN est\u00e1 a correr");
            return;
        }
        if (/ALREADY JAILBROKEN/.test(t)) {
            UI.done("Desbloqueio realizado", "j\u00e1 estava desbloqueada");
            return;
        }
        if (/REBOOT/.test(t)) {
            UI.fail("Falhou", "desliga a PS4 e volta a ligar antes de repetir");
            return;
        }
        if (/no win in|REBOOT FIRST/.test(t)) {
            UI.fail("Falhou", "reabre o browser e tenta outra vez");
            return;
        }
        if (/no offsets/.test(t)) {
            UI.fail("Firmware n\u00e3o suportado", "este desbloqueio n\u00e3o serve para esta consola");
            return;
        }
        if (/FAILED/.test(t)) {
            UI.fail("Falhou", "reabre o browser e tenta outra vez");
            return;
        }
        for (var i = 0; i < STAGES.length; i++) {
            if (STAGES[i][0].test(t)) {
                UI.set(STAGES[i][1], STAGES[i][2]);
                break;
            }
        }
    }

    function refresh() { judge(stateEl.textContent || ""); }

    if (window.MutationObserver) {
        new MutationObserver(refresh)
            .observe(stateEl, { childList: true, characterData: true, subtree: true });
        new MutationObserver(refresh)
            .observe(out, { childList: true, characterData: true, subtree: true });
    } else {
        setInterval(refresh, 1500);
    }
    refresh();
}());
</script>
</body>
</html>
