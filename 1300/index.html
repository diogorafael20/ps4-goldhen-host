<!DOCTYPE html>
<html lang="pt" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desbloqueio</title>
<link rel="icon" type="image/png" href="../pspulse.png">
</head>
<body>
<script src="../ui.js"></script>
<script>
(function () {
    var UI = window.HostUI;

    function sessionGet(name) {
        try { return sessionStorage.getItem(name); } catch (e) { return null; }
    }
    function sessionSet(name, value) {
        try {
            sessionStorage.setItem(name, String(value));
            return sessionStorage.getItem(name) === String(value);
        } catch (e) { return false; }
    }
    function sessionRemove(name) {
        try { sessionStorage.removeItem(name); } catch (e) {}
    }
    function queryValue(name) {
        var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
        if (!m) return null;
        try { return decodeURIComponent(m[1]); } catch (e) { return null; }
    }

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var hex = minor.toString(16);
        if (hex.length < 2) hex = "0" + hex;
        key = m[1] + "." + hex;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(hex, 10);
    }

    UI.mount({ fw: key || "", msg: "A preparar\u2026" });
    UI.set(3, "A verificar a consola\u2026");

    if (fwnum === 1101 || fwnum === 1102) {
        location.replace("../css/version-selector.html");
        return;
    }

    var LAPSE = { 1100: 1, 1150: 1, 1152: 1, 1200: 1, 1202: 1 };
    var POOPS = { 1250: 1, 1252: 1, 1300: 1 };
    var bug = LAPSE[fwnum] ? "lapse" : (POOPS[fwnum] ? "poops" : null);
    var forced = queryValue("bug");
    if (bug && (forced === "lapse" || forced === "poops")) bug = forced;

    if (!bug) {
        UI.fail("Firmware n\u00e3o suportado",
            key ? "o " + key + " n\u00e3o tem desbloqueio aqui" : "isto n\u00e3o parece uma PS4");
        return;
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;
    var PRE = "hostui.1300.pre:" + target;
    var RELOADED = "hostui.1300.reloaded";
    var launched = false, cacheDone = false, watchdog = null;

    function go() {
        if (launched) return;
        launched = true;
        UI.set(8, "A desbloquear\u2026");
        location.replace(target);
    }

    /* A clean page before the chain starts: the first load of a page has a
       different heap history, and this chain cares. One reload, recorded, so
       a browser with no session storage cannot loop. */
    function run() {
        if (sessionGet(PRE) !== "yes") {
            if (!sessionSet(PRE, "yes")) { go(); return; }
            UI.set(5, "A limpar o estado da p\u00e1gina\u2026");
            setTimeout(function () { location.reload(); }, 700);
            return;
        }
        go();
    }

    function finish() {
        if (cacheDone) return false;
        cacheDone = true;
        if (watchdog !== null) { clearTimeout(watchdog); watchdog = null; }
        return true;
    }

    function fresh(swap) {
        if (!finish()) return;
        if (swap) { try { applicationCache.swapCache(); } catch (e) {} }
        sessionSet(PRE, "yes");
        if (sessionGet(RELOADED) === "yes") { sessionRemove(RELOADED); run(); return; }
        sessionSet(RELOADED, "yes");
        UI.set(5, "Ficheiros prontos \u2014 a recarregar\u2026");
        setTimeout(function () { location.reload(); }, 700);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        if (bug === "poops") {
            UI.fail("Faltam os ficheiros guardados",
                "limpa os dados dos sites no browser e abre outra vez");
            return;
        }
        run();
        return;
    }

    ac.addEventListener("downloading", function () { UI.set(5, "A guardar os ficheiros\u2026"); }, false);
    ac.addEventListener("progress", function (e) {
        if (e && e.total > 0) UI.set(5, "A guardar " + Math.round(e.loaded / e.total * 100) + "%");
    }, false);
    ac.addEventListener("cached", function () { fresh(false); }, false);
    ac.addEventListener("updateready", function () { fresh(true); }, false);
    ac.addEventListener("noupdate", function () {
        if (!finish()) return;
        sessionRemove(RELOADED);
        run();
    }, false);
    ac.addEventListener("error", function () {
        if (!finish()) return;
        sessionRemove(RELOADED);
        if (bug === "poops") {
            UI.fail("Falha ao guardar os ficheiros",
                "limpa os dados dos sites no browser e abre outra vez");
            return;
        }
        go();
    }, false);
    ac.addEventListener("obsolete", function () {
        if (!finish()) return;
        sessionRemove(RELOADED);
        UI.fail("Ficheiros desatualizados", "limpa os dados dos sites no browser e abre outra vez");
    }, false);

    if (!navigator.onLine) {
        finish();
        run();
    } else if (ac.status === ac.UPDATEREADY) {
        fresh(true);
    } else if (ac.status === ac.CHECKING || ac.status === ac.DOWNLOADING || ac.status === ac.UNCACHED) {
        UI.set(4, "A verificar os ficheiros\u2026");
        watchdog = setTimeout(function () {
            if (!finish()) return;
            if (bug === "poops") {
                UI.fail("Demorou demasiado", "limpa os dados dos sites no browser e abre outra vez");
                return;
            }
            go();
        }, 60000);
    } else {
        try { ac.update(); } catch (e) {}
        watchdog = setTimeout(function () {
            if (!finish()) return;
            sessionRemove(RELOADED);
            run();
        }, 5000);
    }
}());
</script>
</body>
</html>
